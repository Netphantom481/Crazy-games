<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>EmulatorJS - PSP DDLC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Favicon: puedes usar tu logo en PNG -->
    <link rel="icon" href="docs/Logo-light.png" type="image/png">

    <style>
      body, html {
        height: 100%;
        margin: 0;
        background-color: black;
        color: white;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: monospace;
      }

      h2 {
        margin-bottom: 20px;
      }

      #game {
        width: 960px;
        height: 540px;
        max-width: 100%;
        background: #111;
        border: 2px solid #444;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <h2>🎮 Doki Doki Literature Club PSP</h2>
    <div id="game"></div>

    <script>
      // Configuración del emulador
      window.EJS_player = "#game";
      window.EJS_core = "psp";
      window.EJS_gameUrl = "games/DDLC-LOVE/EBOOT.PBP"; // Ruta en tu repo
      window.EJS_pathtodata = "data/";
      window.EJS_threads = true; // Requerido para PSP
      window.EJS_startOnLoaded = true;

      // Carga del emulador
      const script = document.createElement("script");
      script.src = "data/loader.js";
      document.body.appendChild(script);
    </script>
  </body>
</html>
